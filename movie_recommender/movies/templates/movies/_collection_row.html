<div class="section-mb">
    <div class="section-hdr">
        <span><i class="fa-solid {{ icon }} me-2 {{ icon_color }}"></i>{{ title }}</span>
        {% if slug %}
        <a href="{% url 'movies:collection_detail' collection_type=slug %}" class="text-muted text-decoration-none small">Все →</a>
        {% endif %}
    </div>
    <div class="collections-scroll">
        {% for movie in movies %}
        <a href="{% url 'movies:movie_detail' movie.id %}" class="coll-card">
            <img src="{{ movie.poster_url|proxy_poster }}" alt="{{ movie.title }}"
                 onerror="this.src='https://via.placeholder.com/150x225/1a1b22/ffffff?text=?'">
            <div class="coll-info">
                <div class="coll-title">{{ movie.title }}</div>
                <div class="coll-rating"><i class="fa-solid fa-star me-1"></i>{{ movie.rating|floatformat:1 }}</div>
            </div>
        </a>
        {% empty %}
        <p class="text-muted py-3">Нет фильмов</p>
        {% endfor %}
    </div>
</div>
